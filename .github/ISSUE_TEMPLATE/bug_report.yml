name: Bug report
description: Report a reproducible problem in MemeDrop.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Please do not disclose security vulnerabilities here. Use the private reporting path in SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Chrome 126 on macOS 14"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots or console output with private information removed.
